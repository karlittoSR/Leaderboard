    function formatTime(sec) {
      const total = Number(sec);
      if (TIME_FORMAT === '1h25m25s225ms') {
        const totalMs = Math.round(Number(sec) * 1000);
        const absMs = Math.max(0, totalMs);
        
        const h = Math.floor(absMs / 3600000);
        const remainderH = absMs % 3600000;
        
        const m = Math.floor(remainderH / 60000);
        const remainderM = remainderH % 60000;
        
        const s = Math.floor(remainderM / 1000);
        const ms = remainderM % 1000;

        const parts = [];
        
        // Hours (only if > 0)
        if (h > 0) { 
            parts.push(`${h}h`); 
        }
        
        // Minutes (if hours exist, pad with 0, else only if > 0)
        if (h > 0) {
            parts.push(`${String(m).padStart(2, '0')}m`);
        } else if (m > 0) {
            parts.push(`${m}m`);
        }
        
        // Seconds (always show, pad if minutes or hours exist)
        if (h > 0 || m > 0) {
            parts.push(`${String(s).padStart(2, '0')}s`);
        } else {
            parts.push(`${s}s`);
        }
        
        // Milliseconds: always padded 3 digits if present (e.g. 036ms)
        if (ms > 0) { 
            parts.push(`${String(ms).padStart(3, '0')}ms`); 
        }
        
        return parts.join(' ');
      }
      
      const totalMs = Math.max(0, Math.round(total * 1000));
      const h = Math.floor(totalMs / 3600000);
      const m = Math.floor((totalMs % 3600000) / 60000);
      const secondsInt = Math.floor((totalMs % 60000) / 1000);
      const milliseconds = totalMs % 1000;

      if (milliseconds > 0) {
        const sFormatted = `${String(secondsInt).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}`;
        const mm = String(m).padStart(2, '0');
        return h > 0 ? `${h}:${mm}:${sFormatted}` : `${m}:${sFormatted}`;
      } else {
        const mm = String(m).padStart(2, '0');
        const ss = String(secondsInt).padStart(2, '0');
        return h > 0 ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
      }
    }

    function parseTimeString(text) {
      if (!text) return null;
      const clean = String(text).trim().replace(',', '.');
      if (!clean) return null;
      if (/^\d+(\.\d+)?$/.test(clean)) {
        const val = Number(clean);
        return Number.isFinite(val) ? val : null;
      }
      const parts = clean.split(':');
      if (parts.length < 2 || parts.length > 3) return null;
      const nums = parts.map(p => Number(p));
      if (nums.some(n => !Number.isFinite(n) || n < 0)) return null;
      let hours = 0;
      let minutes = 0;
      let seconds = 0;
      if (nums.length === 2) {
        [minutes, seconds] = nums;
      } else {
        [hours, minutes, seconds] = nums;
        if (minutes >= 60) return null;
      }
      if (seconds >= 60) return null;
      return (hours * 3600) + (minutes * 60) + seconds;
    }

    function getRankColor(position) {
      if (!Number.isFinite(position) || position < 0) return DRAW.COLORS.other; // e.g. unranked PB ("--")
      return [DRAW.COLORS.top1, DRAW.COLORS.top2, DRAW.COLORS.top3, DRAW.COLORS.other][Math.min(position, 3)];
    }

    function truncatePlayer(name, maxChars = null) {
      if (maxChars === null) {
        maxChars = MAX_PLAYER_NAME_CHARS || 14;
      }
      return name.length > maxChars ? 'W'.repeat(maxChars) : name;
    }

    function drawScrollingText(ctx, text, x, y, maxWidth, style, useRainbow, rainbowPhase, fontBase, baseColor = null) {
      if (!text || maxWidth <= 0) return;
      const color = baseColor || DRAW.COLORS.other;

      // Measure text width
      ctx.font = fontBase || DRAW.FONT_BASE;
      const textWidth = ctx.measureText(text).width;

      // If text fits, draw normally
      if (textWidth <= maxWidth) {
        if (useRainbow) {
          applyRainbowText(rainbowPhase);
          ctx.textAlign = 'left';
          ctx.fillText(text, x, y);
        } else {
          ctx.fillStyle = color;
          if (!baseColor) {
            applyTextStyle(x, y, text, style);
          }
          ctx.textAlign = 'left';
          ctx.fillText(text, x, y);
        }
        return;
      }

      // Scrolling logic (Marquee loop)
      frameNeedsAnimation = true; // scrolling text moves every frame
      const speed = 30; // pixels per second
      const gap = 20;   // gap between loops
      const loopDist = textWidth + gap;
      const totalTime = (loopDist / speed) * 1000;
      const offset = (Date.now() % totalTime) / totalTime * loopDist;

      ctx.save();
      ctx.beginPath();
      const metrics = ctx.measureText('Mg');
      const ascent = metrics.actualBoundingBoxAscent || 18;
      const descent = metrics.actualBoundingBoxDescent || 6;
      ctx.rect(x, y - ascent - 2, maxWidth, ascent + descent + 4);
      ctx.clip();

      const drawInstance = (currentX) => {
         if (useRainbow) {
             applyRainbowText(rainbowPhase);
             ctx.textAlign = 'left';
             ctx.fillText(text, currentX, y);
         } else {
             // For gradient, we need to regenerate execution relative to currentX if desired,
             // but applyTextStyle uses ctx.createLinearGradient(x, ... x+width).
             // We should pass currentX to applyTextStyle.

             ctx.fillStyle = color;
             if (!baseColor) {
               applyTextStyle(currentX, y, text, style);
             }
             ctx.textAlign = 'left';
             ctx.fillText(text, currentX, y);
         }
      };

      // Draw two instances for seamless loop
      // Instance 1
      drawInstance(x - offset);
      // Instance 2
      drawInstance(x - offset + loopDist);

      ctx.restore();
    }

    function applyTextStyle(x, y, text, style) {
      if (!style || style.style === 'solid') {
        ctx.fillStyle = style?.color?.dark || style?.color?.light || '#e2e8f0';
        return;
      }
      if (style.style === 'gradient') {
        const from = style['color-from']?.dark || '#e2e8f0';
        const to = style['color-to']?.dark || '#e2e8f0';
        const width = ctx.measureText(text).width;
        const grad = ctx.createLinearGradient(x, y, x + width, y);
        grad.addColorStop(0, from);
        grad.addColorStop(1, to);
        ctx.fillStyle = grad;
        return;
      }
      ctx.fillStyle = '#e2e8f0';
    }

    function applyRainbowText(phase) {
      frameNeedsAnimation = true; // rainbow text animates every frame
      const hue = Math.floor(phase % 360);
      ctx.fillStyle = rainbowColors[hue];
    }

    function getRankTextAlign() {
      if (RANK_ALIGN === 'left') return 'left';
      if (RANK_ALIGN === 'center') return 'center';
      return 'right';
    }

    function getRankTextX(colRank) {
      if (RANK_ALIGN === 'left') return colRank;
      if (RANK_ALIGN === 'center') return colRank + (fixedMaxRankW / 2);
      return colRank + fixedMaxRankW;
    }

    function getRankIconX(colRank, iconWidth) {
      if (RANK_ALIGN === 'left') return colRank;
      if (RANK_ALIGN === 'center') return colRank + (fixedMaxRankW - iconWidth) / 2;
      return colRank + fixedMaxRankW - iconWidth;
    }

    // Measure text and cache by index (row number)
    function measureAndCache(text, font, cache, idx) {
      ctx.font = font;
      const width = ctx.measureText(text).width;
      if (!cache[idx]) cache[idx] = {};
      cache[idx][font] = width;
      return width;
    }

    // Precompute render properties for a run (called once when data loads)
    function precomputeRunRenderProps(run, idx) {
      const rankText = typeof run.rank === 'number' && run.rank > 0
        ? (RANK_PREFIX_MODE === 'hash' ? `#${run.rank}` : RANK_PREFIX_MODE === 'none' ? `${run.rank}` : `${run.rank}.`)
        : `${run.rank}`;

      // Measure and cache by row index
      const rankTextWidth = measureAndCache(rankText, DRAW.FONT_BASE, measureCache, idx);
      const timeWidth = measureAndCache(run.time, DRAW.FONT_MONO, measureCache, idx);

      return {
        ...run,
        rankText,
        rankTextWidth,
        timeWidth,
        rowIdx: idx,
        isRecent: isRunRecent(run.submitted)
      };
    }

    // === Draw ===
    function draw(topRuns, carouselBatch, fadeProgress = 1, playerRow = null) {
      // Reset per-frame animation flag; set true below whenever we render
      // rainbow text or a scrolling marquee (i.e. content that keeps moving).
      frameNeedsAnimation = false;
      ctx.setTransform(CANVAS_DPR, 0, 0, CANVAS_DPR, 0, 0);

      // Clear canvas for new frame
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      ctx.shadowColor = DRAW.SHADOW.color;
      ctx.shadowBlur = DRAW.SHADOW.blur;
      ctx.shadowOffsetY = DRAW.SHADOW.offsetY;
      ctx.font = DRAW.FONT_BASE;
      ctx.textAlign = 'left';

      const allDisplay = [...topRuns, ...carouselBatch];
      const phaseBase = (Date.now() / 30) % 360;
      const { padX, startY, rowH } = DRAW.LAYOUT;
      const colRank = padX;
      const timeX = canvas.clientWidth - padX; // Right aligned

      // Draw category name at the top
      if (CATEGORY_DISPLAY_NAME) {
        const titleY = DRAW.CATEGORY_TITLE_Y;
        const titleText = CATEGORY_DISPLAY_NAME;
        const titleFont = DRAW.CATEGORY_TITLE_FONT;
        const titleColor = DRAW.CATEGORY_TITLE_COLOR;
        ctx.font = titleFont;
        const titleWidth = ctx.measureText(titleText).width;
        const canvasCenter = canvas.clientWidth / 2;
        const maxTitleWidth = canvas.clientWidth - (padX * 2);
        
        if (titleWidth <= maxTitleWidth) {
          // Title fits - center it
          ctx.textAlign = 'center';
          ctx.fillStyle = titleColor;
          ctx.fillText(titleText, canvasCenter, titleY);
        } else {
          // Title too long - use scrolling
          ctx.textAlign = 'left';
          const titleX = padX;
          const titleStyle = { style: 'solid', color: { dark: titleColor } };
          drawScrollingText(ctx, titleText, titleX, titleY, maxTitleWidth, titleStyle, false, phaseBase, titleFont);
        }
      }

      for (let i = 0; i < allDisplay.length; i++) {
        const r = allDisplay[i];
        const y = startY + i * rowH;
        // Reset font to base for each row
        ctx.font = DRAW.FONT_BASE;
        const isTemporary = !!r.isTemporary;
        const isRecent = r.isRecent;  // Use precomputed value
        const useRainbow = isTemporary ? PB_USE_RAINBOW : isRecent;
        const color = getRankColor(r.rank - 1);  // Use actual rank for color (supports ties)
        const rowColor = isTemporary ? PB_COLOR : color;

        // Apply fade only to carousel rows.
        const isCarouselRow = i >= topRuns.length;
        const globalAlpha = ctx.globalAlpha;
        if (isCarouselRow && fadeProgress < 1) {
          ctx.globalAlpha = fadeProgress;
        }

        // Draw rank (trophy for top 3, # + number for others)
        if (USE_TROPHY_ICONS && r.trophyImg && r.rank >= 1 && r.rank <= 3) {
          // Draw trophy icon for top 3 (centered in rank column)
          drawRoundedImage(
            r.trophyImg,
            getRankIconX(colRank, DRAW.TROPHY.w),
            y - DRAW.TROPHY.yOffset,
            DRAW.TROPHY.w,
            DRAW.TROPHY.h,
            DRAW.TROPHY.radius  // slight rounding
          );
        } else {
          // Draw number right-aligned - use precomputed rankText
          const rankText = r.rankText;
          const rankX = getRankTextX(colRank);
          ctx.textAlign = getRankTextAlign();
          if (useRainbow) {
            applyRainbowText(phaseBase + i * 12);
            ctx.fillText(rankText, rankX, y);
          } else {
            ctx.fillStyle = rowColor;
            ctx.fillText(rankText, rankX, y);
          }
        }

        // Draw flag + name
        let x = colRank + fixedMaxRankW + NAME_SPACING;
        if (r.flagImg) {
          drawRoundedImage(r.flagImg, x, y - DRAW.FLAG.yOffset, DRAW.FLAG.w, DRAW.FLAG.h, DRAW.FLAG.radius);
        } else if (DATA_SOURCE === 'teamhitless') {
          drawTeamHitlessLogo(x, y);
        } else {
           // Default flag (Globe)
           ctx.save();
           ctx.font = '16px sans-serif'; // Adapted size for the flag box
           ctx.textAlign = 'center';
           ctx.textBaseline = 'middle';
           ctx.fillText('🌎', x + DRAW.FLAG.w / 2, y - 6);
           ctx.restore();
        }
        x += DRAW.FLAG.w + NAME_SPACING; // Keep space even when there is no flag, to make names aligned.

        // Calculate available width for name using the configured maxNameWidthVisible
        // Use fixedMaxNameBlock (which we calculated using MAX_PLAYER_NAME_CHARS) as the base constraint
        // But also ensure we don't overlap time (responsive shrinking is still okay)

        // Use precomputed timeWidth instead of measuring each frame
        const timeWidth = r.timeWidth;

        // The maximum standard width allowed by configuration (excluding flag width part of fixedMaxNameBlock)
        // fixedMaxNameBlock includes flag width + name, so we subtract flag width to get "max configured name width"
        const currentFlagW = DRAW.FLAG.w + NAME_SPACING;
        const configuredMaxNameWidth = Math.max(50, fixedMaxNameBlock - currentFlagW);

        // The absolute available space on screen before hitting the time
        const screenSpaceAvailable = timeX - timeWidth - x - 12; // 12px padding

        // Use the smaller of the two: respect config, but shrink if screen is too small
        const availableWidth = Math.max(0, Math.min(configuredMaxNameWidth, screenSpaceAvailable));

        const rawName = isTemporary ? `${PB_PREFIX} - ${r.player}` : r.player;
        drawScrollingText(ctx, rawName, x, y, availableWidth, r.nameStyle, useRainbow, phaseBase + 40 + i * 12, DRAW.FONT_BASE, isTemporary ? PB_COLOR : null);

        // Draw time (right-aligned)
        ctx.font = DRAW.FONT_MONO;
        ctx.textAlign = 'right';
        if (useRainbow) {
          applyRainbowText(phaseBase + 80 + i * 12);
          ctx.fillText(r.time, timeX, y);
        } else {
          ctx.fillStyle = rowColor;
          ctx.fillText(r.time, timeX, y);
        }

        ctx.globalAlpha = globalAlpha;
      }

      if (playerRow) {
        const canvasH = canvas.clientHeight;
        const isTemporary = !!playerRow.isTemporary;
        const useRainbow = PB_USE_RAINBOW;  // Master control: true = always rainbow, false = always use pbColor

        // Position PB row with fixed gap below last carousel run, separator line in the middle
        const lastRunY = startY + (allDisplay.length - 1) * rowH; // Y position of last displayed run
        const gapRows = 2; // Gap of 2 row heights between last run and PB row
        const y = lastRunY + gapRows * rowH; // PB row position
        const lineY = lastRunY + (gapRows / 2) * rowH - 4; // Separator line centered in the gap (moved 4px up)
        ctx.save();
        ctx.globalAlpha = 0.7;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        const areaStartX = padX + 6;
        const areaEndX = Math.min(timeX - 6, canvas.clientWidth - padX);
        const maxBarWidth = Math.max(0, areaEndX - areaStartX);
        let barWidth = Number.isFinite(PB_SEPARATOR_WIDTH) ? PB_SEPARATOR_WIDTH : maxBarWidth;
        if (maxBarWidth < 50) {
          barWidth = maxBarWidth;
        } else {
          barWidth = Math.min(Math.max(barWidth, 50), maxBarWidth);
        }
        const lineStartX = areaStartX + (maxBarWidth - barWidth) / 2;
        const lineEndX = lineStartX + barWidth;
        ctx.moveTo(lineStartX, lineY);
        ctx.lineTo(lineEndX, lineY);
        ctx.stroke();
        ctx.restore();

        // Reset font to base
        ctx.font = DRAW.FONT_BASE;

        // Draw rank (trophy for top 3, # + number for others)
        if (USE_TROPHY_ICONS && playerRow.trophyImg && playerRow.rank >= 1 && playerRow.rank <= 3) {
          // Draw trophy icon for top 3 (centered in rank column)
          drawRoundedImage(
            playerRow.trophyImg,
            getRankIconX(colRank, DRAW.TROPHY.w),
            y - DRAW.TROPHY.yOffset,
            DRAW.TROPHY.w,
            DRAW.TROPHY.h,
            4
          );
        } else {
          // Draw number right-aligned - use precomputed rankText
          const rankText = playerRow.rankText;
          const rankX = getRankTextX(colRank);
          ctx.textAlign = getRankTextAlign();
          if (useRainbow) {
            applyRainbowText(phaseBase);
            ctx.fillText(rankText, rankX, y);
          } else {
            ctx.fillStyle = PB_COLOR;
            ctx.fillText(rankText, rankX, y);
          }
        }

        let x = colRank + fixedMaxRankW + NAME_SPACING;
        if (playerRow.flagImg) {
          drawRoundedImage(playerRow.flagImg, x, y - DRAW.FLAG.yOffset, DRAW.FLAG.w, DRAW.FLAG.h, DRAW.FLAG.radius);
        } else if (DATA_SOURCE === 'teamhitless') {
          drawTeamHitlessLogo(x, y);
        } else {
           // Default flag (Globe)
           ctx.save();
           ctx.font = '16px sans-serif';
           ctx.textAlign = 'center';
           ctx.textBaseline = 'middle';
           ctx.fillText('🌎', x + DRAW.FLAG.w / 2, y - 6);
           ctx.restore();
        }
        x += DRAW.FLAG.w + NAME_SPACING; // Keep space even when there is no flag, to make names aligned.

        // Calculate available width for name using the configured maxNameWidthVisible
        // Use fixedMaxNameBlock (which we calculated using MAX_PLAYER_NAME_CHARS) as the base constraint
        // But also ensure we don't overlap time (responsive shrinking is still okay)

        // Use precomputed timeWidth instead of measuring each frame
        const timeWidth = playerRow.timeWidth;

        // The maximum standard width allowed by configuration
        const currentFlagW = DRAW.FLAG.w + NAME_SPACING;
        const configuredMaxNameWidth = Math.max(50, fixedMaxNameBlock - currentFlagW);

        // The absolute available space on screen before hitting the time
        const screenSpaceAvailable = timeX - timeWidth - x - 12; // 12px padding

        // Use the smaller of the two
        const availableWidth = Math.max(0, Math.min(configuredMaxNameWidth, screenSpaceAvailable));

        const rawName = isTemporary ? `${PB_PREFIX} - ${playerRow.player}` : playerRow.player;
        drawScrollingText(ctx, rawName, x, y, availableWidth, playerRow.nameStyle, useRainbow, phaseBase + 40, DRAW.FONT_BASE, PB_COLOR);

        ctx.font = DRAW.FONT_MONO;
        ctx.textAlign = 'right';
        if (useRainbow) {
          applyRainbowText(phaseBase + 80);
          ctx.fillText(playerRow.time, timeX, y);
        } else {
          ctx.fillStyle = PB_COLOR;
          ctx.fillText(playerRow.time, timeX, y);
        }
        ctx.globalAlpha = 1;
      }

      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
    }

    // === Render loop ===
    // Single requestAnimationFrame loop that drives the carousel phases AND only
    // repaints when something is actually animating (rainbow text, scrolling
    // names, or an in-progress fade). When the board is static it idles without
    // burning CPU/GPU - important since this runs continuously inside OBS.
    function renderTick(now) {
      animationFrameId = null;
      if (!renderState) return;

      const { processedTop, carouselRuns: runs, displayRunsPerBatch, processedPlayerRow } = renderState;

      // No carousel: a single static page. Repaint only while it still animates.
      if (!(runs.length > 0 && displayRunsPerBatch > 0)) {
        if (lastFrameAnimated) {
          draw(processedTop, [], 1, processedPlayerRow);
          lastFrameAnimated = frameNeedsAnimation;
        }
        if (lastFrameAnimated) startRenderLoop();
        return;
      }

      const elapsed = now - carouselStartTime;
      const pageCount = Math.ceil(runs.length / displayRunsPerBatch);
      const batchStart = carouselPage * displayRunsPerBatch;
      const batch = runs.slice(batchStart, batchStart + displayRunsPerBatch);

      if (carouselPhase === 'fadeIn') {
        if (elapsed < CAROUSEL_FADE_DURATION) {
          draw(processedTop, batch, elapsed / CAROUSEL_FADE_DURATION, processedPlayerRow);
          startRenderLoop();
        } else {
          carouselPhase = 'display';
          carouselStartTime = now;
          draw(processedTop, batch, 1, processedPlayerRow);
          lastFrameAnimated = frameNeedsAnimation;
          if (lastFrameAnimated) startRenderLoop();
          else scheduleRenderWake(CAROUSEL_DISPLAY_DURATION);
        }
      } else if (carouselPhase === 'display') {
        if (elapsed >= CAROUSEL_DISPLAY_DURATION) {
          carouselPhase = 'fadeOut';
          carouselStartTime = now;
          draw(processedTop, batch, 1, processedPlayerRow);
          startRenderLoop();
        } else if (lastFrameAnimated) {
          // Stable phase: only repaint if the content keeps moving.
          draw(processedTop, batch, 1, processedPlayerRow);
          lastFrameAnimated = frameNeedsAnimation;
          if (lastFrameAnimated) startRenderLoop();
          else scheduleRenderWake(CAROUSEL_DISPLAY_DURATION - elapsed);
        } else {
          scheduleRenderWake(CAROUSEL_DISPLAY_DURATION - elapsed);
        }
      } else if (carouselPhase === 'fadeOut') {
        if (elapsed < CAROUSEL_FADE_DURATION) {
          draw(processedTop, batch, 1 - (elapsed / CAROUSEL_FADE_DURATION), processedPlayerRow);
          startRenderLoop();
        } else {
          carouselPage = (carouselPage + 1) % pageCount;
          carouselPhase = 'fadeIn';
          carouselStartTime = now;
          const nextStart = carouselPage * displayRunsPerBatch;
          draw(processedTop, runs.slice(nextStart, nextStart + displayRunsPerBatch), 0, processedPlayerRow);
          startRenderLoop();
        }
      }
    }

    function scheduleRenderWake(delay) {
      if (renderWakeTimer !== null) clearTimeout(renderWakeTimer);
      renderWakeTimer = setTimeout(() => {
        renderWakeTimer = null;
        startRenderLoop();
      }, Math.max(0, delay));
    }

    function pauseRenderLoop() {
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      if (renderWakeTimer !== null) {
        clearTimeout(renderWakeTimer);
        renderWakeTimer = null;
      }
    }

    function startRenderLoop() {
      if (renderWakeTimer !== null) {
        clearTimeout(renderWakeTimer);
        renderWakeTimer = null;
      }
      if (animationFrameId === null) {
        animationFrameId = requestAnimationFrame(renderTick);
      }
    }

    // === Data processing ===
    function waitForRetry(ms, signal) {
      return new Promise((resolve, reject) => {
        if (signal?.aborted) {
          reject(new DOMException('Aborted', 'AbortError'));
          return;
        }
        const onAbort = () => {
          clearTimeout(timer);
          reject(new DOMException('Aborted', 'AbortError'));
        };
        const timer = setTimeout(() => {
          signal?.removeEventListener('abort', onAbort);
          resolve();
        }, ms);
        signal?.addEventListener('abort', onAbort, { once: true });
      });
    }

    async function fetchJSON(url, { timeout = 10000, signal = null, retries = 2 } = {}) {
      let lastError = null;

      for (let attempt = 0; attempt <= retries; attempt++) {
        if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');

        const timeoutController = new AbortController();
        let timedOut = false;
        const timeoutId = setTimeout(() => {
          timedOut = true;
          timeoutController.abort();
        }, timeout);
        const forwardAbort = () => timeoutController.abort();
        signal?.addEventListener('abort', forwardAbort, { once: true });

        try {
          const response = await fetch(url, { signal: timeoutController.signal, cache: 'no-store' });
          if (!response.ok) {
            const retryable = response.status === 429 || response.status >= 500;
            const error = new Error(`HTTP ${response.status} pour ${url}`);
            error.retryable = retryable;
            throw error;
          }
          return await response.json();
        } catch (error) {
          if (signal?.aborted) throw new DOMException('Aborted', 'AbortError');
          lastError = timedOut
            ? new Error(`Delai d'attente depasse (${timeout}ms) pour ${url}`)
            : error;
          const retryable = timedOut || error.retryable || error.name === 'TypeError';
          if (!retryable || attempt >= retries) throw lastError;
          await waitForRetry(500 * (2 ** attempt), signal);
        } finally {
          clearTimeout(timeoutId);
          signal?.removeEventListener('abort', forwardAbort);
        }
      }

      throw lastError;
    }

    async function resolveCategoryAndVariable(signal) {
      const storedPairs = Array.isArray(SUBCATEGORIES)
        ? SUBCATEGORIES
          .filter(entry => entry?.variableId && entry?.valueId)
          .map(entry => ({ variableId: entry.variableId, valueId: entry.valueId }))
        : [];
      if (CATEGORY_ID && (storedPairs.length > 0 || !SUBCATEGORY_LABEL)) {
        return { categoryId: CATEGORY_ID, variablePairs: storedPairs };
      }

      const url = `https://www.speedrun.com/api/v1/games/${GAME_ID}?embed=categories.variables`;
      let data = gameMetadataCache.get(GAME_ID);
      if (!data) {
        data = await fetchJSON(url, { signal });
        gameMetadataCache.set(GAME_ID, data);
      }
      const cats = data.data.categories.data;
      const targetType = LEVEL_ID ? 'per-level' : 'per-game';
      const cat = cats.find(c => c.type === targetType && c.name === CATEGORY_NAME);
      if (!cat) throw new Error(`Categorie "${CATEGORY_NAME}" non trouvee (options : ${cats.map(c => c.name).join(', ')})`);
      
      const vars = (cat.variables?.data) || [];

      // New structure: list of subcategory IDs
      if (Array.isArray(SUBCATEGORIES) && SUBCATEGORIES.length > 0) {
        const usedVars = new Set();
        const variablePairs = [];

        for (const entry of SUBCATEGORIES) {
          if (!entry) continue;
          let matched = null;

          if (entry.variableId && entry.valueId) {
            const variable = vars.find(v => v.id === entry.variableId);
            if (variable && variable.values?.values && variable.values.values[entry.valueId]) {
              matched = { variableId: entry.variableId, valueId: entry.valueId };
              usedVars.add(entry.variableId);
            }
          }

          if (!matched && entry.label) {
            const targetLabel = String(entry.label).toLowerCase();
            const variable = vars.find(v => v['is-subcategory'] && !usedVars.has(v.id) && v.values?.values &&
              Object.values(v.values.values).some(val => (val.label || '').toLowerCase() === targetLabel));
            if (variable) {
              const valueEntry = Object.entries(variable.values.values)
                .find(([, value]) => (value.label || '').toLowerCase() === targetLabel);
              if (valueEntry) {
                matched = { variableId: variable.id, valueId: valueEntry[0] };
                usedVars.add(variable.id);
              }
            }
          }

          if (matched) {
            variablePairs.push(matched);
          }
        }

        if (variablePairs.length > 0) {
          return { categoryId: cat.id, variablePairs };
        }
      }

      // No subcategory required
      if (!SUBCATEGORY_LABEL) {
        return { categoryId: cat.id, variablePairs: [] };
      }

      const labels = SUBCATEGORY_LABEL.split(' - ').map(s => s.trim()).filter(Boolean);
      const usedVars = new Set();
      const variablePairs = [];

      for (const label of labels) {
        const sub = vars.find(v => v['is-subcategory'] && v.values?.values && !usedVars.has(v.id) &&
          Object.values(v.values.values).some(val => val.label.toLowerCase() === label.toLowerCase()));
        if (!sub) throw new Error(`Sous-categorie "${label}" non trouvee pour "${CATEGORY_NAME}"`);

        const entry = Object.entries(sub.values.values)
          .find(([, value]) => value.label.toLowerCase() === label.toLowerCase());
        if (!entry) throw new Error(`Valeur "${label}" non trouvee`);

        const [valueId] = entry;
        variablePairs.push({ variableId: sub.id, valueId });
        usedVars.add(sub.id);
      }

      return { categoryId: cat.id, variablePairs };
    }

    function calculateColumnWidths(allRuns, playerRow) {
      ctx.font = DRAW.FONT_BASE;
      let maxRankW = 0;
      let maxNameBlock = 0;
      const trophyWidth = DRAW.TROPHY.w;  // Width for trophy icons

      const widthRuns = playerRow ? [...allRuns, playerRow] : allRuns;
      for (let i = 0; i < widthRuns.length; i++) {
        const r = widthRuns[i];
        // Trophy takes fixed width for top 3
        if (r.rank >= 1 && r.rank <= 3 && USE_TROPHY_ICONS) {
          maxRankW = Math.max(maxRankW, trophyWidth);
        } else {
          // Calculate rank text and width directly (no cache needed here)
          const rankText = typeof r.rank === 'number' && r.rank > 0
            ? (RANK_PREFIX_MODE === 'hash' ? `#${r.rank}` : RANK_PREFIX_MODE === 'none' ? `${r.rank}` : `${r.rank}.`)
            : `${r.rank}`;
          const numberW = ctx.measureText(rankText).width;
          maxRankW = Math.max(maxRankW, numberW);
        }

        // Name block width (flag + truncated name)
        const flagW = DRAW.FLAG.w + NAME_SPACING;  // Always account for flag space
        const truncatedName = truncatePlayer(r.player);
        const nameW = ctx.measureText(truncatedName).width;
        maxNameBlock = Math.max(maxNameBlock, flagW + nameW);
      }

      // Ensure minimum width based on configured MAX_PLAYER_NAME_CHARS
      const configuredMaxName = 'W'.repeat(MAX_PLAYER_NAME_CHARS || 14);
      const configuredMaxWidth = ctx.measureText(configuredMaxName).width;
      const maxFlagW = DRAW.FLAG.w + NAME_SPACING;
      const minConfiguredBlock = maxFlagW + configuredMaxWidth;

      // Use the larger of actual data width or configured minimum width
      maxNameBlock = Math.max(maxNameBlock, minConfiguredBlock);

      // Total rank width: max of trophy width OR number width
      fixedMaxRankW = Math.max(trophyWidth, maxRankW);
      fixedMaxNameBlock = maxNameBlock;
    }

    function getResponsiveRowCounts(playerRow) {
      const reservedBottomSpace = playerRow ? (2 * DRAW.LAYOUT.rowH) : 0;
      const availableRows = Math.max(0, Math.floor(
        (canvas.clientHeight - DRAW.LAYOUT.startY - reservedBottomSpace) / DRAW.LAYOUT.rowH
      ));
      const visibleTopRows = Math.min(TOP_COUNT, availableRows);
      const roomForCarousel = Math.max(0, availableRows - visibleTopRows);
      return {
        visibleTopRows,
        displayRunsPerBatch: Math.min(RUNS_PER_BATCH, roomForCarousel)
      };
    }

    function getCarouselFadeProgress(now = performance.now()) {
      const elapsed = Math.max(0, now - carouselStartTime);
      if (carouselPhase === 'fadeIn') {
        return Math.min(1, elapsed / CAROUSEL_FADE_DURATION);
      }
      if (carouselPhase === 'fadeOut') {
        return Math.max(0, 1 - (elapsed / CAROUSEL_FADE_DURATION));
      }
      return 1;
    }

    function relayoutRenderState() {
      if (!renderState) return;
      const { allProcessedTop, carouselRuns: runs, processedPlayerRow } = renderState;
      const { visibleTopRows, displayRunsPerBatch } = getResponsiveRowCounts(processedPlayerRow);
      const processedTop = allProcessedTop.slice(0, visibleTopRows);
      const pageCount = displayRunsPerBatch > 0
        ? Math.max(1, Math.ceil(runs.length / displayRunsPerBatch))
        : 1;
      carouselPage %= pageCount;
      renderState = { ...renderState, processedTop, displayRunsPerBatch };
      const batchStart = carouselPage * displayRunsPerBatch;
      const batch = displayRunsPerBatch > 0 ? runs.slice(batchStart, batchStart + displayRunsPerBatch) : [];
      draw(processedTop, batch, getCarouselFadeProgress(), processedPlayerRow);
      lastFrameAnimated = frameNeedsAnimation;
      startRenderLoop();
    }

    // Fetches the speedrun.com leaderboard and maps it to overlay run rows.
    async function fetchSpeedrunComRuns(signal) {
      const { categoryId, variablePairs } = await resolveCategoryAndVariable(signal);
      
      // Build leaderboard URL. An active PB needs the complete leaderboard so
      // its temporary rank is calculated against every run, not just the
      // configured display window (for example, maxRuns: 100).
      let lbUrl;
      const limit = Math.max(TOP_COUNT, MAX_RUNS || 0);
      const needsGameAssets = USE_TROPHY_ICONS && !trophyAssetCache.has(GAME_ID);
      const embedParams = needsGameAssets ? 'game,players' : 'players';
      const query = new URLSearchParams();
      if (!(PLAYER_NAME && TEMPORARY_RUN && TEMPORARY_RUN.time)) {
        query.set('top', limit);
      }
      query.set('embed', embedParams);

      if (Array.isArray(variablePairs) && variablePairs.length > 0) {
        for (const pair of variablePairs) {
          if (pair.variableId && pair.valueId) {
            query.set(`var-${pair.variableId}`, pair.valueId);
          }
        }
      }

      if (LEVEL_ID) {
        lbUrl = `https://www.speedrun.com/api/v1/leaderboards/${GAME_ID}/level/${LEVEL_ID}/${categoryId}?${query}`;
      } else {
        lbUrl = `https://www.speedrun.com/api/v1/leaderboards/${GAME_ID}/category/${categoryId}?${query}`;
      }
      
      const lb = await fetchJSON(lbUrl, {
        signal,
        timeout: TEMPORARY_RUN ? 20000 : 10000
      });
      if (signal.aborted) throw new DOMException('Aborted', 'AbortError');

      // Extract trophy URLs from embedded game data (only if trophy icons enabled)
      if (USE_TROPHY_ICONS && lb.data.game?.data?.assets) {
        const assets = lb.data.game.data.assets;
        TROPHY_1ST_URL = assets['trophy-1st']?.uri || null;
        TROPHY_2ND_URL = assets['trophy-2nd']?.uri || null;
        TROPHY_3RD_URL = assets['trophy-3rd']?.uri || null;
        trophyAssetCache.set(GAME_ID, {
          1: TROPHY_1ST_URL,
          2: TROPHY_2ND_URL,
          3: TROPHY_3RD_URL
        });
      }

      // Build player map
      const playerMap = new Map();
      if (lb.data.players?.data) {
        for (const player of lb.data.players.data) {
          const displayName = player.rel === 'guest' ? player.name : (player.names?.international || player.id);
          playerMap.set(player.id, {
            name: displayName,
            style: player['name-style'] || null,
            country: player.location?.country?.code || null
          });
        }
      }

      // Process runs
      const allRuns = (lb.data.runs || []).map((entry) => {
        const run = entry.run;
        const players = (run.players || []).map((p) => {
          if (p.rel === 'guest') return p.name;
          const info = playerMap.get(p.id);
          return info ? info.name : p.id;
        });

        const firstPlayer = run.players?.[0];
        const playerInfo = firstPlayer && firstPlayer.rel !== 'guest'
          ? (playerMap.get(firstPlayer.id) || { name: players[0] || 'Inconnu', style: null, country: null })
          : { name: players[0] || 'Inconnu', style: null, country: null };

        const timeSeconds = Number.isFinite(run.times?.primary_t) ? run.times.primary_t : 0;
        return {
          rank: entry.place || 0,
          player: playerInfo.name,
          players,
          nameStyle: playerInfo.style,
          country: normalizeCountry(playerInfo.country),
          time: formatTime(timeSeconds),
          timeSeconds,
          submitted: run.submitted
        };
      });

      return allRuns;
    }

    // === Team Hitless ===
    // Leaderboards are Divi "Table Maker" grids: every cell carries its position as
    // dvmd_tm_col_X / dvmd_tm_row_Y classes (row 0 = headers). A table is named by
    // the nearest <h3> before it, inside the current <h2> section. configure.ps1
    // (Get-TeamHitlessTables) reads pages the same way so tableIndex values match.
    const teamHitlessPageCache = new Map(); // slug -> { fetchedAt, tables }

    function cleanHeadingText(text) {
      return String(text || '').replace(/\s+/g, ' ').trim();
    }

    function normalizeHeading(text) {
      return cleanHeadingText(text).toLowerCase();
    }

    function parseTeamHitlessTables(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const tables = [];
      let section = null;
      let pendingTitle = null;

      for (const el of doc.querySelectorAll('h2, h3, div.dvmd_table_maker')) {
        if (el.tagName === 'H2') {
          section = cleanHeadingText(el.textContent) || null;
          pendingTitle = null;
          continue;
        }
        if (el.tagName === 'H3') {
          pendingTitle = cleanHeadingText(el.textContent) || null;
          continue;
        }

        const cells = new Map();
        let maxRow = 0;
        let maxCol = 0;
        for (const cell of el.querySelectorAll('.dvmd_tm_tcell')) {
          const col = /\bdvmd_tm_col_(\d+)\b/.exec(cell.className);
          const row = /\bdvmd_tm_row_(\d+)\b/.exec(cell.className);
          if (!col || !row) continue;
          const r = Number(row[1]);
          const c = Number(col[1]);
          cells.set(`${r}:${c}`, cleanHeadingText(cell.textContent));
          maxRow = Math.max(maxRow, r);
          maxCol = Math.max(maxCol, c);
        }

        const headers = [];
        for (let c = 0; c <= maxCol; c++) headers.push(cells.get(`0:${c}`) || '');
        const findCol = (pattern, fallback) => {
          const idx = headers.findIndex(h => pattern.test(h));
          return idx >= 0 ? idx : fallback;
        };
        const playerCol = findCol(/player|runner/i, 1);
        const timeCol = findCol(/time|igt|rta/i, 2);

        // Placeholder rows ("Test Runner 0:00") and empty rows are skipped.
        const rows = [];
        let previousSeconds = 0;
        for (let r = 1; r <= maxRow; r++) {
          const player = cells.get(`${r}:${playerCol}`) || '';
          // "42:47:034" is minutes:seconds:milliseconds (seconds never have 3 digits).
          const timeText = (cells.get(`${r}:${timeCol}`) || '').replace(/^(\d+:\d{2}):(\d{3})$/, '$1.$2');
          let timeSeconds = parseTimeString(timeText);
          // Rows are listed fastest first, so a time below the previous one is a
          // typo such as "1:35.45" for "1:35:45": read the dot as a colon when
          // that puts the row back in order.
          if (Number.isFinite(timeSeconds) && timeSeconds < previousSeconds && timeText.split('.').length === 2) {
            const repaired = parseTimeString(timeText.replace('.', ':'));
            // ...but never into an outlier ("52:10.20" must not become 52 hours).
            if (Number.isFinite(repaired) && repaired >= previousSeconds && repaired <= previousSeconds * 2) timeSeconds = repaired;
          }
          if (!player || !Number.isFinite(timeSeconds) || timeSeconds <= 0) continue;
          rows.push({ player, timeSeconds });
          previousSeconds = timeSeconds;
        }

        tables.push({ index: tables.length, section, title: pendingTitle, rows });
        pendingTitle = null; // a heading names only the first table after it
      }

      return tables;
    }

    // Prefer the stored index while its headings still match, then the headings
    // alone (a table was added or removed above), then the bare index.
    function resolveTeamHitlessTable(tables, ref) {
      const section = normalizeHeading(ref.section);
      const title = normalizeHeading(ref.title);
      const matches = t => normalizeHeading(t.section) === section && normalizeHeading(t.title) === title;
      const byIndex = tables[ref.tableIndex] || null;
      if (byIndex && matches(byIndex)) return byIndex;
      if (title) {
        const found = tables.find(matches);
        if (found) return found;
      }
      return byIndex;
    }

    // Team Hitless names have no colors, so each player gets one from a palette
    // of distinct hues. It is derived from the name (FNV-1a hash), so a player
    // keeps the same color across refreshes; a color already used by one of the
    // two previous rows moves to the next hue so neighbours stay distinguishable.
    const TEAMHITLESS_NAME_COLORS = [
      '#ee4444', '#ef8241', '#f0c03e', '#b5e655', '#4cc86a', '#2ed1b0',
      '#44bbee', '#6f8cff', '#9a7cf4', '#d070f0', '#f772c5', '#ff9a8a'
    ];

    function getTeamHitlessNameStyles(names) {
      const usedIndexes = [];
      return names.map(name => {
        let hash = 0x811c9dc5;
        for (const ch of String(name).toLowerCase()) {
          hash ^= ch.codePointAt(0);
          hash = Math.imul(hash, 0x01000193) >>> 0;
        }
        let idx = hash % TEAMHITLESS_NAME_COLORS.length;
        while (usedIndexes.slice(-2).includes(idx)) idx = (idx + 1) % TEAMHITLESS_NAME_COLORS.length;
        usedIndexes.push(idx);
        const color = TEAMHITLESS_NAME_COLORS[idx];
        return { style: 'solid', color: { light: color, dark: color } };
      });
    }

    async function fetchTeamHitlessRuns(signal) {
      const slug = TEAMHITLESS.slug;
      let cached = teamHitlessPageCache.get(slug);
      if (!cached || performance.now() - cached.fetchedAt > TEAMHITLESS_CACHE_MS) {
        const url = `${TEAMHITLESS_API}?slug=${encodeURIComponent(slug)}&_fields=slug,modified,content`;
        const pages = await fetchJSON(url, { signal, timeout: 15000 });
        if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
        const page = Array.isArray(pages) ? pages[0] : null;
        if (!page?.content?.rendered) {
          throw new Error(`Page Team Hitless "${slug}" introuvable`);
        }
        cached = { fetchedAt: performance.now(), tables: parseTeamHitlessTables(page.content.rendered) };
        teamHitlessPageCache.set(slug, cached);
      }

      const table = resolveTeamHitlessTable(cached.tables, TEAMHITLESS);
      if (!table) {
        const label = TEAMHITLESS.title || TEAMHITLESS.section || `#${TEAMHITLESS.tableIndex + 1}`;
        throw new Error(`Classement Team Hitless "${label}" introuvable sur "${slug}"`);
      }

      // Team Hitless has no countries, submission dates, trophy assets or name colors.
      const nameStyles = getTeamHitlessNameStyles(table.rows.map(row => row.player));
      return table.rows.map((row, i) => ({
        rank: 0,
        player: row.player,
        players: [row.player],
        nameStyle: nameStyles[i],
        country: null,
        time: formatTime(row.timeSeconds),
        timeSeconds: row.timeSeconds,
        submitted: null
      }));
    }

    async function loadTop({ resetCarousel = false } = {}) {
      const generation = ++loadGeneration;
      if (activeLoadController) activeLoadController.abort();
      const controller = new AbortController();
      activeLoadController = controller;
      try {
        const allRuns = DATA_SOURCE === 'teamhitless'
          ? await fetchTeamHitlessRuns(controller.signal)
          : await fetchSpeedrunComRuns(controller.signal);
        if (generation !== loadGeneration || controller.signal.aborted) return false;

        if (PLAYER_NAME && TEMPORARY_RUN && TEMPORARY_RUN.time) {
          const target = PLAYER_NAME.toLowerCase();
          const officialMatch = allRuns.find(r => (r.players || []).some(n => n.toLowerCase() === target));
          const tempSeconds = parseTimeString(TEMPORARY_RUN.time);
          if (Number.isFinite(tempSeconds)) {
            // Keep every official run intact and insert the PB as a hypothetical
            // entry. This makes its rank "number of official faster runs + 1",
            // even when the configured PB is slower than an existing official run.
            allRuns.push({
              rank: 0,
              player: PLAYER_NAME,
              players: [PLAYER_NAME],
              nameStyle: officialMatch?.nameStyle || null,
              country: officialMatch?.country || normalizeCountry(PLAYER_COUNTRY),
              time: formatTime(tempSeconds),
              timeSeconds: tempSeconds,
              submitted: new Date().toISOString(),
              isTemporary: true,
              isUnranked: TEMPORARY_RUN.ranked === false
            });
          }
        }

        // An unranked PB sorts after every official run, whatever its time, and
        // is displayed with "--" instead of a position.
        const rankingTime = r => (r.isUnranked || !Number.isFinite(r.timeSeconds))
          ? Number.POSITIVE_INFINITY
          : r.timeSeconds;
        let sortedRuns = allRuns
          .map((r, idx) => ({ ...r, _idx: idx }))
          .sort((a, b) => {
            const aTime = rankingTime(a);
            const bTime = rankingTime(b);
            if (aTime !== bTime) return aTime - bTime;
            return a._idx - b._idx;
          });

        // Assign ranks with tie handling (same time = same rank)
        let lastTime = null;
        let lastRank = 0;
        sortedRuns = sortedRuns.map((r, idx) => {
          const copy = { ...r };
          delete copy._idx;
          if (r.isUnranked) {
            copy.rank = '--'; // shown without a position, after every official run
          } else if (r.timeSeconds === lastTime) {
            copy.rank = lastRank;
          } else {
            copy.rank = idx + 1;
            lastRank = copy.rank;
            lastTime = r.timeSeconds;
          }
          return copy;
        });

        let playerRow = null;
        if (PLAYER_NAME) {
          const target = PLAYER_NAME.toLowerCase();
          const match = sortedRuns.find(r => r.isTemporary)
            || sortedRuns.find(r => (r.players || []).some(n => n.toLowerCase() === target));
          if (match) {
            const isInTop = typeof match.rank === 'number' && match.rank >= 1 && match.rank <= TOP_COUNT;
            if (!isInTop) {
              playerRow = { ...match, player: PLAYER_NAME };
            }
          }
        }

        // Split into top N and carousel
        const topRuns = sortedRuns.slice(0, TOP_COUNT);
        const rawCarouselRuns = sortedRuns.slice(TOP_COUNT, Math.max(TOP_COUNT, MAX_RUNS || 0));
        const visibleRuns = [...topRuns, ...rawCarouselRuns];
        if (playerRow) visibleRuns.push(playerRow);

        // Only load assets used by visible rows and the dedicated PB row.
        const countryCodes = Array.from(new Set(visibleRuns.map(r => r.country).filter(Boolean)));
        await Promise.allSettled(countryCodes.map(loadFlagImage));
        
        const flagMap = new Map();
        for (const code of countryCodes) {
          const key = code.toLowerCase();
          const flagUrl = `https://flagcdn.com/w40/${key}.png`;
          flagMap.set(code, imageCache.flags.get(flagUrl) || null);
        }
        console.log(`Drapeaux charges : ${countryCodes.length}`);

        // Load trophy images (only if trophy icons enabled)
        let trophyMap = { 1: null, 2: null, 3: null };
        if (USE_TROPHY_ICONS) {
          const trophyUrls = [TROPHY_1ST_URL, TROPHY_2ND_URL, TROPHY_3RD_URL].filter(Boolean);
          await Promise.allSettled(trophyUrls.map(url => loadTrophyImage(url)));
          console.log(`Trophy images loaded: ${trophyUrls.length}`);

          // Build trophy image map
          trophyMap = {
            1: TROPHY_1ST_URL ? imageCache.trophies.get(TROPHY_1ST_URL) : null,
            2: TROPHY_2ND_URL ? imageCache.trophies.get(TROPHY_2ND_URL) : null,
            3: TROPHY_3RD_URL ? imageCache.trophies.get(TROPHY_3RD_URL) : null
          };
        }
        if (generation !== loadGeneration || controller.signal.aborted) return false;

        // Clear measurement cache for new data
        measureCache.length = 0;

        const processRuns = (runs, startIdx) => runs.map((r, i) => {
          const idx = startIdx + i;
          return precomputeRunRenderProps({
            ...r,
            flagImg: flagMap.get(r.country) || null,
            trophyImg: trophyMap[r.rank] || null  // Add trophy image for top 3
          }, idx);
        });

        const processedTop = processRuns(topRuns, 0);
        const processedCarouselRuns = processRuns(rawCarouselRuns, TOP_COUNT);
        const playerRowIdx = TOP_COUNT + processedCarouselRuns.length;
        const processedPlayerRow = playerRow ? precomputeRunRenderProps({
          ...playerRow,
          flagImg: flagMap.get(playerRow.country) || null,
          trophyImg: trophyMap[playerRow.rank] || null
        }, playerRowIdx) : null;

        // Invisible full-leaderboard rows must not affect the visible layout.
        calculateColumnWidths([...topRuns, ...rawCarouselRuns], processedPlayerRow);

        // Draw and start carousel.
        const { visibleTopRows, displayRunsPerBatch } = getResponsiveRowCounts(processedPlayerRow);
        const visibleProcessedTop = processedTop.slice(0, visibleTopRows);

        // Preserve the carousel position across data reloads. loadTop() also runs
        // on every auto-refresh (REFRESH_INTERVAL); resetting to page 0 here would
        // snap the carousel back to the start each cycle, so viewers never see past
        // the first few pages (e.g. only ranks up to ~13 before it restarted).
        // Keep the current page, clamped in case the number of pages shrank.
        const pageCount = displayRunsPerBatch > 0
          ? Math.max(1, Math.ceil(processedCarouselRuns.length / displayRunsPerBatch))
          : 1;
        if (resetCarousel || !renderState) {
          carouselPage = 0;
          carouselPhase = 'fadeIn';
          carouselStartTime = performance.now();
        }
        carouselPage = carouselPage % pageCount;
        const batchStart = carouselPage * displayRunsPerBatch;

        const firstBatch = displayRunsPerBatch > 0
          ? processedCarouselRuns.slice(batchStart, batchStart + displayRunsPerBatch)
          : [];

        // Hand the freshly processed data to the single rAF render loop.
        carouselRuns = processedCarouselRuns;
        renderState = {
          allProcessedTop: processedTop,
          processedTop: visibleProcessedTop,
          carouselRuns: processedCarouselRuns,
          displayRunsPerBatch,
          processedPlayerRow
        };

        // Initial paint, then let the render loop take over.
        draw(visibleProcessedTop, firstBatch, getCarouselFadeProgress(), processedPlayerRow);
        lastFrameAnimated = frameNeedsAnimation;
        startRenderLoop();
        return true;
      } catch (e) {
        if (e.name === 'AbortError') return false;
        console.error(e);
        // Preserve the last successful render during transient API failures.
        if (!renderState) drawStatusMessage(e.message);
        return false;
      } finally {
        if (generation === loadGeneration) {
          activeLoadController = null;
        }
      }
    }

    // Periodically re-fetch the leaderboard data from speedrun.com so times stay
    // live during a stream. loadConfig() re-arms this on completion, so it forms
    // a self-perpetuating loop.
    //
    // Data refresh is independent from carousel position, so the configured
    // interval remains accurate even when a full carousel cycle is long.
    function scheduleAutoRefresh(delayOverride = null) {
      if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
      if (REFRESH_INTERVAL_MS <= 0 && !Number.isFinite(delayOverride)) return; // auto-refresh disabled
      const wait = Number.isFinite(delayOverride) ? delayOverride : REFRESH_INTERVAL_MS;
      refreshTimer = setTimeout(() => loadConfig(false), wait);
    }

    // Watch config.json for edits (much faster than the leaderboard refresh): the
    // moment the file changes - switching the active category, adding a preset,
    // updating name/PB/visuals via the PowerShell tool - reload right away instead
    // of waiting for the next full carousel cycle. Reading a local file every few
    // seconds is cheap; it only triggers a reload when the contents actually change.
    function watchConfig() {
      if (configWatchTimer) clearInterval(configWatchTimer);
      configWatchTimer = setInterval(async () => {
        if (isConfigLoading) return; // a reload is already in progress
        try {
          const res = await fetch('config.json', { cache: 'no-store' });
          if (!res.ok) return;
          const text = await res.text();
          if (lastConfigText === null || text !== lastConfigText) {
            loadConfig(false); // config.json changed on disk - apply it now
          }
        } catch (_) {
          // Ignore transient read errors; the next tick will try again.
        }
      }, 3000);
    }

    loadConfig().then(watchConfig);

    // Resizing only changes layout; cached leaderboard data is reused.
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        updateCanvasSize();
        relayoutRenderState();
      }, 250);
    });
  </script>
</body>
