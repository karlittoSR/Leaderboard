<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Speedrun.com Leaderboard Overlay</title>
  <style>
    :root { --muted:#94a3b8; --text:#e2e8f0; }
    html, body { height: 100%; margin: 0; }
    body {
      background: transparent; /* twitch/karlitto__ */
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      display: grid; place-items: start; padding: 8px;
    }
    canvas { display: block; max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>
  <canvas id="board"></canvas>
  <script>
    // === Settings Loading ===
    // Variables loaded from settings file (config.json)
    let GAME_ID;
    let CATEGORY_ID;
    let CATEGORY_NAME;
    let CATEGORY_DISPLAY_NAME; // Full category name for display
    let SUBCATEGORY_LABEL;
    let SUBCATEGORIES;
    let LEVEL_ID;
    let PLAYER_NAME;
    let PLAYER_COUNTRY = 'FR';
    let TEMPORARY_RUN;
    let RUNS_PER_BATCH;
    let TOP_COUNT;
    let MAX_RUNS;
    let MAX_PLAYER_NAME_CHARS = 18;
    let FLAG_OVERRIDES;
    let USE_TROPHY_ICONS = false;
    let RANK_ALIGN = 'right';
    let RANK_PREFIX_MODE = 'dot';
    let NAME_SPACING = 4;
    let TIME_FORMAT = '1:25:25.255';
    let PB_SEPARATOR_WIDTH = null;
    let PB_PREFIX = 'PB';
    let PB_COLOR = '#9fb4ca';
    let PB_USE_RAINBOW = false;
    let RAINBOW_INTENSITY = 50;
    let PREFERRED_WIDTH = 400;
    let PREFERRED_HEIGHT = 274;
    let CANVAS_DPR = 1;
    let REFRESH_INTERVAL_MS = 30000; // Auto-refresh leaderboard data (0 = disabled)
    let DATA_SOURCE = 'speedruncom'; // 'speedruncom' or 'teamhitless'
    let TEAMHITLESS = null;          // { slug, section, title, tableIndex } of a Team Hitless preset

    const CONFIG_SCHEMA_VERSION = 2;
    // Team Hitless leaderboards are WordPress pages. The REST API echoes the request
    // origin in its CORS headers (OBS serves local files from http://absolute/),
    // while the HTML pages are blocked for non-browser clients.
    const TEAMHITLESS_API = 'https://www.teamhitless.com/wp-json/wp/v2/pages';
    const TEAMHITLESS_MIN_REFRESH_MS = 5 * 60 * 1000; // site is updated by hand: poll gently
    const TEAMHITLESS_CACHE_MS = 60 * 1000;           // reuse a page across quick config edits
    const DEFAULT_SETTINGS = Object.freeze({
      topCount: 3,
      timeFormat: '1:25:25.255',
      rankAlign: 'left',
      rankPrefixMode: 'dot',
      nameSpacing: 5,
      pbSeparatorWidth: 320,
      pbPrefix: 'PB',
      pbColor: '#fffff1',
      pbUseRainbow: true,
      customFont: '',
      fontSize: 18,
      rainbowIntensity: 90,
      CAROUSEL_DISPLAY_DURATION: 5000,
      CAROUSEL_FADE_DURATION: 500,
      useTrophyIcons: true,
      displayWidth: 500,
      displayHeight: 450,
      runsPerBatch: 4,
      maxRuns: 200,
      fontStyle: 'Arial',
      maxNameWidthVisible: 18,
      categoryNameVisible: true,
      categoryNameColor: '#ffffff',
      categoryNameSpacing: 35,
      refreshInterval: 30
    });

    function clampNumber(value, fallback, min, max, integer = false) {
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return fallback;
      const clamped = Math.min(max, Math.max(min, parsed));
      return integer ? Math.round(clamped) : clamped;
    }

    function normalizeHexColor(value, fallback) {
      const text = String(value || '').trim();
      const hex = text.startsWith('#') ? text.slice(1) : text;
      return /^[0-9a-fA-F]{6}$/.test(hex) ? `#${hex.toLowerCase()}` : fallback;
    }

    function normalizeConfig(config) {
      if (!config || typeof config !== 'object' || Array.isArray(config)) {
        throw new Error('config.json doit contenir un objet JSON.');
      }
      if (!config.categories && config.presets && typeof config.presets === 'object') {
        config.categories = config.presets;
      }
      if (!config.activeCategory && config.activePreset) {
        config.activeCategory = config.activePreset;
      }
      if (!config.categories || typeof config.categories !== 'object' || Array.isArray(config.categories)) {
        throw new Error('La propriété "categories" de config.json est invalide.');
      }

      const raw = (config.defaults && typeof config.defaults === 'object') ? config.defaults : {};
      const defaults = { ...DEFAULT_SETTINGS, ...raw };

      defaults.topCount = clampNumber(defaults.topCount, DEFAULT_SETTINGS.topCount, 1, 5, true);
      defaults.runsPerBatch = clampNumber(defaults.runsPerBatch, DEFAULT_SETTINGS.runsPerBatch, 1, 5, true);
      defaults.maxRuns = clampNumber(defaults.maxRuns, DEFAULT_SETTINGS.maxRuns, 10, 200, true);
      defaults.maxRuns = Math.max(defaults.topCount, defaults.maxRuns);
      defaults.nameSpacing = clampNumber(defaults.nameSpacing, DEFAULT_SETTINGS.nameSpacing, 0, 10, true);
      defaults.pbSeparatorWidth = clampNumber(defaults.pbSeparatorWidth, DEFAULT_SETTINGS.pbSeparatorWidth, 50, 4000, true);
      defaults.fontSize = clampNumber(defaults.fontSize, DEFAULT_SETTINGS.fontSize, 14, 24, true);
      defaults.rainbowIntensity = clampNumber(defaults.rainbowIntensity, DEFAULT_SETTINGS.rainbowIntensity, 0, 100, true);
      defaults.CAROUSEL_DISPLAY_DURATION = clampNumber(defaults.CAROUSEL_DISPLAY_DURATION, DEFAULT_SETTINGS.CAROUSEL_DISPLAY_DURATION, 1000, 10000, true);
      defaults.CAROUSEL_FADE_DURATION = clampNumber(defaults.CAROUSEL_FADE_DURATION, DEFAULT_SETTINGS.CAROUSEL_FADE_DURATION, 50, 1000, true);
      defaults.displayWidth = clampNumber(defaults.displayWidth, DEFAULT_SETTINGS.displayWidth, 200, 4000, true);
      defaults.displayHeight = clampNumber(defaults.displayHeight, DEFAULT_SETTINGS.displayHeight, 100, 3000, true);
      defaults.maxNameWidthVisible = clampNumber(defaults.maxNameWidthVisible, DEFAULT_SETTINGS.maxNameWidthVisible, 4, 60, true);
      defaults.categoryNameSpacing = clampNumber(defaults.categoryNameSpacing, DEFAULT_SETTINGS.categoryNameSpacing, 12, 50, true);

      const refresh = Number(defaults.refreshInterval);
      defaults.refreshInterval = Number.isFinite(refresh)
        ? (refresh <= 0 ? 0 : Math.min(3600, Math.max(30, refresh)))
        : DEFAULT_SETTINGS.refreshInterval;

      defaults.rankAlign = ['left', 'center', 'right'].includes(String(defaults.rankAlign).toLowerCase())
        ? String(defaults.rankAlign).toLowerCase()
        : DEFAULT_SETTINGS.rankAlign;
      defaults.rankPrefixMode = ['dot', 'hash', 'none'].includes(String(defaults.rankPrefixMode).toLowerCase())
        ? String(defaults.rankPrefixMode).toLowerCase()
        : DEFAULT_SETTINGS.rankPrefixMode;
      defaults.timeFormat = ['1:25:25.255', '1h25m25s225ms'].includes(String(defaults.timeFormat))
        ? String(defaults.timeFormat)
        : DEFAULT_SETTINGS.timeFormat;

      const prefix = String(defaults.pbPrefix || '').trim().toUpperCase();
      defaults.pbPrefix = /^[A-Z]{1,3}$/.test(prefix) ? prefix : DEFAULT_SETTINGS.pbPrefix;
      defaults.pbColor = normalizeHexColor(defaults.pbColor, DEFAULT_SETTINGS.pbColor);
      defaults.categoryNameColor = normalizeHexColor(defaults.categoryNameColor, DEFAULT_SETTINGS.categoryNameColor);
      defaults.pbUseRainbow = defaults.pbUseRainbow === true;
      defaults.useTrophyIcons = defaults.useTrophyIcons === true;
      defaults.categoryNameVisible = defaults.categoryNameVisible !== false;
      defaults.customFont = String(defaults.customFont || '').trim().replace(/["\\]/g, '').slice(0, 30);
      defaults.fontStyle = String(defaults.fontStyle || DEFAULT_SETTINGS.fontStyle);

      config.defaults = defaults;
      config.schemaVersion = Number.isInteger(config.schemaVersion) ? config.schemaVersion : 1;
      config.flagOverrides = (config.flagOverrides && typeof config.flagOverrides === 'object')
        ? config.flagOverrides
        : {};
      return config;
    }

    // Trophy icon URLs (loaded from game assets)
    let TROPHY_1ST_URL = null;
    let TROPHY_2ND_URL = null;
    let TROPHY_3RD_URL = null;

    async function loadConfig(isInitial = true) {
      if (isConfigLoading) return; // avoid overlapping config reloads
      isConfigLoading = true;
      try {
        // Load settings file (config.json) - bypass cache so live PS1 edits are picked up
        const configRes = await fetch('config.json', { cache: 'no-store' });
        if (!configRes.ok) {
          throw new Error(`Impossible de charger config.json (HTTP ${configRes.status})`);
        }
        // Keep the raw text so the config watcher can detect edits (category
        // switch, new preset, name/PB/visual changes) and reload immediately.
        const configText = await configRes.text();
        const configChanged = lastConfigText !== null && configText !== lastConfigText;
        if (configChanged) pauseRenderLoop();
        const config = normalizeConfig(JSON.parse(configText));
        if (config.schemaVersion > CONFIG_SCHEMA_VERSION) {
          console.warn(`config.json utilise le schema ${config.schemaVersion}; cette version prend en charge le schema ${CONFIG_SCHEMA_VERSION}.`);
        }

        // Get the active category from the settings file (no URL parameter needed)
        const categoryName = config.activeCategory;
        if (!categoryName) {
          throw new Error('Aucune catégorie active définie dans config.json. Utilisez le script PowerShell pour en définir une.');
        }

        const category = config.categories[categoryName];
        if (!category) {
          const availableCategories = Object.keys(config.categories);
          throw new Error(`Catégorie active "${categoryName}" non trouvée. Options disponibles : ${availableCategories.join(', ')}`);
        }
        const source = category.source === 'teamhitless' ? 'teamhitless' : 'speedruncom';
        if (source === 'teamhitless') {
          if (!category.teamHitless || !category.teamHitless.slug) {
            throw new Error(`La catégorie active "${categoryName}" ne contient pas teamHitless.slug.`);
          }
        } else if (!category.gameId || !category.category) {
          throw new Error(`La catégorie active "${categoryName}" ne contient pas gameId/category.`);
        }

        // A different active category means a different leaderboard, so restart
        // the carousel from the top instead of continuing mid-cycle.
        const categoryChanged = currentActiveCategory !== null && currentActiveCategory !== categoryName;

        // Apply category settings
        DATA_SOURCE = source;
        TEAMHITLESS = source === 'teamhitless'
          ? {
              slug: String(category.teamHitless.slug),
              section: category.teamHitless.section || null,
              title: category.teamHitless.title || null,
              tableIndex: Number.isInteger(category.teamHitless.tableIndex) ? category.teamHitless.tableIndex : -1
            }
          : null;
        GAME_ID = category.gameId || null;
        const cachedTrophies = trophyAssetCache.get(GAME_ID);
        TROPHY_1ST_URL = cachedTrophies?.[1] || null;
        TROPHY_2ND_URL = cachedTrophies?.[2] || null;
        TROPHY_3RD_URL = cachedTrophies?.[3] || null;
        CATEGORY_ID = category.categoryId || null;
        CATEGORY_NAME = category.category;
        CATEGORY_DISPLAY_NAME = category.name; // Store full display name
        SUBCATEGORY_LABEL = category.subcategory;
        SUBCATEGORIES = category.subcategories || null;
        if (SUBCATEGORIES && !Array.isArray(SUBCATEGORIES)) {
          SUBCATEGORIES = [SUBCATEGORIES];
        }
        LEVEL_ID = category.levelId || null;
        PLAYER_NAME = (config.playerName || '').trim();
        if (PLAYER_NAME === '') PLAYER_NAME = null;
        PLAYER_COUNTRY = (config.playerCountry || 'FR').trim().toUpperCase();
        if (PLAYER_COUNTRY.length !== 2) PLAYER_COUNTRY = 'FR'; // Fallback to FR if invalid

        // Personal best is per-category (category.personalBest). Fall back to the
        // legacy global config.temporaryRun for configs that predate the change.
        // Without a player name, never show a PB/temporary entry at all.
        const pbRun = (category.personalBest && category.personalBest.active && category.personalBest.time)
          ? category.personalBest
          : (config.temporaryRun || null);
        if (PLAYER_NAME && pbRun && pbRun.active && pbRun.time) {
          // ranked: false keeps the PB out of the ranking (always shown last),
          // e.g. a run with hits on a hitless leaderboard.
          TEMPORARY_RUN = { time: String(pbRun.time).trim(), ranked: pbRun.ranked !== false };
        } else {
          TEMPORARY_RUN = null;
        }
        FLAG_OVERRIDES = config.flagOverrides || {};

        // Apply defaults from the settings file
        const defaults = config.defaults;
        CAROUSEL_DISPLAY_DURATION = defaults.CAROUSEL_DISPLAY_DURATION || 3000;
        CAROUSEL_FADE_DURATION = defaults.CAROUSEL_FADE_DURATION || 500;
        RUNS_PER_BATCH = defaults.runsPerBatch;
        TOP_COUNT = defaults.topCount;
        MAX_RUNS = Number.isFinite(defaults.maxRuns) ? defaults.maxRuns : 200;
        MAX_PLAYER_NAME_CHARS = defaults.maxNameWidthVisible || defaults.maxPlayerNameChars || 14;
        USE_TROPHY_ICONS = defaults.useTrophyIcons === true;
        const rankAlign = (defaults.rankAlign || 'right').toLowerCase();
        RANK_ALIGN = ['left', 'center', 'right'].includes(rankAlign) ? rankAlign : 'right';
        const rankPrefixMode = (defaults.rankPrefixMode || 'dot').toLowerCase();
        RANK_PREFIX_MODE = ['dot', 'hash', 'none'].includes(rankPrefixMode) ? rankPrefixMode : 'dot';
        const spacingValue = Number(defaults.nameSpacing);
        NAME_SPACING = Number.isFinite(spacingValue) ? Math.min(10, Math.max(0, spacingValue)) : 4;
        const timeFormatValue = String(defaults.timeFormat || '1:25:25.255').trim();
        TIME_FORMAT = (timeFormatValue === '1h25m25s225ms' || timeFormatValue === '1:25:25.255') ? timeFormatValue : '1:25:25.255';
        const pbSeparatorValue = Number(defaults.pbSeparatorWidth);
        PB_SEPARATOR_WIDTH = Number.isFinite(pbSeparatorValue) ? pbSeparatorValue : null;
        const pbPrefixValue = String(defaults.pbPrefix || 'PB').trim().toUpperCase();
        PB_PREFIX = (pbPrefixValue.length >= 1 && pbPrefixValue.length <= 3 && /^[A-Z]+$/.test(pbPrefixValue)) ? pbPrefixValue : 'PB';
        const pbColorValue = String(defaults.pbColor || '9fb4ca').trim();
        PB_COLOR = pbColorValue.startsWith('#') ? pbColorValue : '#' + pbColorValue;
        PB_USE_RAINBOW = defaults.pbUseRainbow === true;
        const rainbowValue = Number(defaults.rainbowIntensity);
        RAINBOW_INTENSITY = Number.isFinite(rainbowValue) ? Math.min(100, Math.max(0, rainbowValue)) : 50;
        // Auto-refresh interval (seconds in config). 0 disables; otherwise clamp to >= 30s
        // to stay friendly with the speedrun.com API.
        const refreshSeconds = Number(defaults.refreshInterval);
        REFRESH_INTERVAL_MS = refreshSeconds <= 0 ? 0 : refreshSeconds * 1000;
        if (DATA_SOURCE === 'teamhitless' && REFRESH_INTERVAL_MS > 0) {
          REFRESH_INTERVAL_MS = Math.max(REFRESH_INTERVAL_MS, TEAMHITLESS_MIN_REFRESH_MS);
        }

        // Initialize rainbow colors table
        initRainbowColors();

        // Apply Font Style
        const customFont = defaults.customFont || '';
        const fontStyle = defaults.fontStyle || 'Arial';
        const fontSize = defaults.fontSize || 18; // Default 18px
        DRAW.LAYOUT.rowH = Math.max(24, Math.ceil(fontSize * 1.4));
        
        let selectedFontFamily;
        let isCustomFont = false;
        
        // If customFont is set, use it directly, otherwise use the predefined fontStyle
        if (customFont.trim()) {
          // User provided custom font name - use it with generic fallback
          selectedFontFamily = `"${customFont}", sans-serif`;
          isCustomFont = true;
        } else {
          // Use predefined font from dropdown
          const fontMap = {
              'Arial': 'Arial, sans-serif',
              'Verdana': 'Verdana, Geneva, sans-serif',
              'TimesNewRoman': '"Times New Roman", Times, serif',
              'Georgia': 'Georgia, serif',
              'CourierNew': '"Courier New", Courier, monospace',
              'Impact': 'Impact, Charcoal, sans-serif',
              'TrebuchetMS': '"Trebuchet MS", Helvetica, sans-serif',
              'Tahoma': 'Tahoma, Geneva, sans-serif',
              'ComicSans': '"Comic Sans MS", "Comic Sans", cursive, sans-serif',
              'SegoeUI': '"Segoe UI", Tahoma, Geneva, Verdana, sans-serif'
          };
          selectedFontFamily = fontMap[fontStyle] || fontMap['Arial'];
        }
        
        // For custom fonts, don't apply font-weight - let the font render with its natural weight
        // For system fonts, use bold (700) for better contrast
        if (isCustomFont) {
          DRAW.FONT_BASE = `${fontSize}px ` + selectedFontFamily;
          DRAW.FONT_MONO = `${fontSize}px ` + selectedFontFamily;
        } else {
          DRAW.FONT_BASE = `700 ${fontSize}px ` + selectedFontFamily;
          DRAW.FONT_MONO = `700 ${fontSize}px ` + selectedFontFamily;
        }

        // Category name display settings with backward compatibility
        const categoryNameVisible = defaults.categoryNameVisible !== false; // Default to true
        const categoryNameColor = defaults.categoryNameColor || '#84c8ff';
        const categoryNameSpacing = defaults.categoryNameSpacing || 14;
        if (isCustomFont) {
          DRAW.CATEGORY_TITLE_FONT = `${fontSize}px ` + selectedFontFamily;
        } else {
          DRAW.CATEGORY_TITLE_FONT = `700 ${fontSize}px ` + selectedFontFamily;
        }
        DRAW.CATEGORY_TITLE_COLOR = categoryNameVisible ? categoryNameColor : 'transparent';
        DRAW.CATEGORY_TITLE_Y = Math.round(fontSize * 0.75); // Position relative to font size
        DRAW.LAYOUT.startY = DRAW.CATEGORY_TITLE_Y + categoryNameSpacing;

        // Update title
        document.title = category.name + ': Top ' + TOP_COUNT + ' (Overlay)';

        // Update overlay size from defaults (handle both old "900px" and new 900 format)
        let dw = defaults.displayWidth;
        let dh = defaults.displayHeight;
        PREFERRED_WIDTH = typeof dw === 'string' ? parseInt(dw) : (Number.isFinite(dw) ? dw : 900);
        PREFERRED_HEIGHT = typeof dh === 'string' ? parseInt(dh) : (Number.isFinite(dh) ? dh : 274);
        // Legacy support: ignore canvasWidth/canvasHeight if present (no longer used)

        updateCanvasSize();

        // Start data load and wait until the new render state is ready before
        // scheduling the next refresh.
        const loaded = await loadTop({ resetCarousel: isInitial || categoryChanged });
        if (!loaded) {
          scheduleAutoRefresh(10000);
          return;
        }

        // Remember what we successfully applied so the config watcher can spot
        // future edits, then (re)arm the periodic refresh for this cycle length.
        lastConfigText = configText;
        currentActiveCategory = categoryName;
        scheduleAutoRefresh();
      } catch (e) {
        console.error('Erreur de configuration :', e);
        // Show configuration errors on first load. During an auto-refresh, keep
        // showing the last good render instead of wiping it.
        if (isInitial) {
          drawStatusMessage(`Erreur : ${e.message}`);
        }
      } finally {
        isConfigLoading = false;
      }
    }

    // Responsive canvas sizing - adapts to container size
    function updateCanvasSize() {
      // Get body padding from computed style
      const style = getComputedStyle(document.body);
      const padX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      const padY = parseFloat(style.paddingTop) + parseFloat(style.paddingBottom);

      // Calculate available space (viewport minus padding)
      const availableWidth = window.innerWidth - padX;
      const availableHeight = window.innerHeight - padY;

      // Use available space if smaller than preferred
      const actualWidth = Math.min(PREFERRED_WIDTH, availableWidth);
      const actualHeight = Math.min(PREFERRED_HEIGHT, availableHeight);

      // Set CSS size
      canvas.style.width = actualWidth + 'px';
      canvas.style.height = actualHeight + 'px';

      // Set pixel size (considering device pixel ratio for crisp rendering)
      const deviceDpr = Math.min(2, window.devicePixelRatio || 1);
      const maxPixelDpr = Math.sqrt(16000000 / Math.max(1, actualWidth * actualHeight));
      CANVAS_DPR = Math.max(1, Math.min(deviceDpr, maxPixelDpr));
      canvas.width = Math.floor(actualWidth * CANVAS_DPR);
      canvas.height = Math.floor(actualHeight * CANVAS_DPR);
    }

    // === Overlay Setup ===
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');

    function drawStatusMessage(message) {
      const width = canvas.clientWidth || 300;
      const height = canvas.clientHeight || 150;
      ctx.setTransform(CANVAS_DPR, 0, 0, CANVAS_DPR, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.font = '14px monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ff6b6b';
      ctx.fillText(String(message).slice(0, 100), 8, Math.min(24, height - 8));
    }

    // Drawing constants
    const DRAW = {
      FLAG: { w: 20, h: 15, yOffset: 14, radius: 5 },
      TROPHY: { w: 20, h: 20, yOffset: 16, radius: 4 }, // Trophy icon dimensions
      LAYOUT: { padX: 12, startY: 38, rowH: 24 },
      FONT_BASE: '700 18px Arial, sans-serif',
      FONT_MONO: '700 18px Arial, sans-serif, SFMono-Regular, Menlo, Consolas, "Liberation Mono"',
      SHADOW: { color: 'transparent', blur: 0, offsetY: 0 },
      COLORS: { top1: '#ffd700', top2: '#c0c0c0', top3: '#cd7f32', other: '#9fb4ca' },
      CATEGORY_TITLE_FONT: '700 16px Arial, sans-serif',
      CATEGORY_TITLE_COLOR: '#84c8ff',
      CATEGORY_TITLE_Y: 12
    };

    // Image caches
    const imageCache = {
      flags: new Map(),
      trophies: new Map()
    };
    const trophyAssetCache = new Map();

    // Text measurement cache (array for fast access by row index)
    const measureCache = [];

    // Precomputed rainbow colors (360 hues)
    let rainbowColors = [];

    // HSL to RGB conversion (needed for rainbow colors)
    function hslToRgb(h, s, l) {
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;

      if (h >= 0 && h < 60) { r = c; g = x; b = 0; }
      else if (h >= 60 && h < 120) { r = x; g = c; b = 0; }
      else if (h >= 120 && h < 180) { r = 0; g = c; b = x; }
      else if (h >= 180 && h < 240) { r = 0; g = x; b = c; }
      else if (h >= 240 && h < 300) { r = x; g = 0; b = c; }
      else { r = c; g = 0; b = x; }

      const rr = Math.round((r + m) * 255);
      const gg = Math.round((g + m) * 255);
      const bb = Math.round((b + m) * 255);
      return `rgb(${rr}, ${gg}, ${bb})`;
    }

    // Precompute rainbow colors table
    function initRainbowColors() {
      const intensity = Math.min(1, Math.max(0, RAINBOW_INTENSITY / 100));
      const saturation = 0.15 + (0.85 * intensity);

      rainbowColors = new Array(360);
      for (let h = 0; h < 360; h++) {
        rainbowColors[h] = hslToRgb(h, saturation, 0.7);
      }
    }

    // Carousel state
    let carouselPage = 0;
    let carouselRuns = [];
    let carouselStartTime = 0;
    let carouselPhase = 'display'; // 'display', 'fadeOut', 'fadeIn'
    let CAROUSEL_FADE_DURATION = 500; // Fade transition duration (ms) - loaded from config
    let CAROUSEL_DISPLAY_DURATION = 3000; // Display duration (ms) - loaded from config

    // Single requestAnimationFrame render loop state
    let renderState = null;        // processed visible rows plus cached full top/carousel rows
    let animationFrameId = null;   // active rAF handle (null = loop not running)
    let renderWakeTimer = null;    // wakes a static carousel when its display phase ends
    let frameNeedsAnimation = false; // set by draw(): true if the rendered frame contains rainbow/scrolling
    let lastFrameAnimated = false;   // whether the last drawn frame still needs to animate
    let activeLoadController = null; // cancels stale leaderboard requests
    let loadGeneration = 0;          // only the newest request may commit render state
    let isConfigLoading = false;     // guards against overlapping loadConfig() calls
    let refreshTimer = null;         // auto-refresh timer handle
    let configWatchTimer = null;     // fast config.json change-watch handle
    let lastConfigText = null;       // raw text of the last successfully applied config
    let currentActiveCategory = null;// active category of the last applied config

    let fixedMaxRankW = 0;
    let fixedMaxNameBlock = 0;
    const gameMetadataCache = new Map();
    async function loadImage(url, cache, timeout = 5000) {
      if (!url) return null;
      if (cache.has(url)) return cache.get(url);
      
      return new Promise((resolve) => {
        const img = new Image();

        const timeoutId = setTimeout(() => {
          resolve(null);
        }, timeout);

        img.onload = () => {
          clearTimeout(timeoutId);
          cache.set(url, img);
          resolve(img);
        };

        img.onerror = () => {
          clearTimeout(timeoutId);
          resolve(null);
        };

        img.src = url;
      });
    }

    function loadFlagImage(code) {
      if (!code) return Promise.resolve(null);
      const url = `https://flagcdn.com/w40/${code.toLowerCase()}.png`;

    function normalizeCountry(code) {
      if (!code) return null;
      const key = String(code).toUpperCase();
      if (FLAG_OVERRIDES && Object.prototype.hasOwnProperty.call(FLAG_OVERRIDES, key)) {
        const override = FLAG_OVERRIDES[key];
        if (!override) return null;
        return String(override).toUpperCase();
      }
      return key;

    function isRunRecent(submittedDate) {
      if (!submittedDate) return false;
      const date = new Date(submittedDate);
      if (isNaN(date.getTime())) return false;
      const now = new Date();
      const diffMs = now - date;
      const diffDays = diffMs / (1000 * 60 * 60 * 24);
      return diffDays < 5;
    }

    function drawRoundedImage(img, x, y, w, h, r) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(img, x, y, w, h);
      ctx.restore();
    }
